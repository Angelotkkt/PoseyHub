<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Simply Hub</title>
<style>
  :root {
    --bg: #0f0f14;
    --panel: #16161e;
    --hover: #22222d;
    --text: #e8e8f0;
    --muted: #8a8a9a;
    --accent: #ff3b3b;
    --sidebar: 72px;
    --topbar: 36px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }

  /* ---------- Barre du haut ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--topbar);
    display: flex; align-items: center; gap: 4px;
    padding-left: calc(var(--sidebar) + 6px);
    padding-right: 150px; /* place pour les boutons Windows */
    -webkit-app-region: drag;
    border-bottom: 1px solid #1d1d27;
  }
  .brand {
    position: absolute; left: 0; top: 0; width: var(--sidebar); height: var(--topbar);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; letter-spacing: .5px; color: var(--text);
  }
  .brand span { color: var(--accent); transition: color .25s; }
  .nav-btn {
    -webkit-app-region: no-drag;
    width: 28px; height: 26px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .nav-btn:hover { background: var(--hover); color: var(--text); }
  .nav-btn svg { width: 16px; height: 16px; }
  .title {
    margin-left: 8px; font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title b { color: var(--text); font-weight: 600; }
  .progress {
    position: absolute; left: var(--sidebar); right: 0; bottom: -1px; height: 2px;
    background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: 0;
    transition: opacity .3s;
  }
  .progress.on { opacity: 1; animation: load 1.4s ease-in-out infinite; }
  @keyframes load {
    0% { transform: scaleX(0); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(1); opacity: 0; }
  }

  /* ---------- Barre latérale ---------- */
  .sidebar {
    position: fixed; top: var(--topbar); left: 0; bottom: 0; width: var(--sidebar);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0; gap: 8px; background: var(--bg);
  }
  .svc {
    position: relative; width: 48px; height: 48px; border: 0; cursor: pointer;
    border-radius: 16px; background: var(--panel); color: var(--muted);
    display: grid; place-items: center;
    transition: border-radius .18s, background .18s, color .18s;
  }
  .svc svg { width: 24px; height: 24px; }
  .svc:hover { border-radius: 14px; background: var(--hover); color: var(--c); }
  .svc.active { border-radius: 14px; background: var(--c); color: #fff; }
  .svc.active.dark-ink { color: #0b0b0f; }
  .svc::before { /* indicateur à gauche */
    content: ""; position: absolute; left: -12px; top: 50%;
    width: 4px; height: 0; border-radius: 0 4px 4px 0; background: var(--text);
    transform: translateY(-50%); transition: height .18s;
  }
  .svc:hover::before { height: 18px; }
  .svc.active::before { height: 36px; }
  .badge {
    position: absolute; right: -4px; bottom: -4px; min-width: 20px; height: 20px;
    padding: 0 5px; border-radius: 10px; border: 3px solid var(--bg);
    background: #f23f43; color: #fff; font-size: 11px; font-weight: 700; line-height: 14px;
    text-align: center; display: none;
  }
  .badge.dot { min-width: 14px; width: 14px; height: 14px; padding: 0; right: -2px; bottom: -2px; }
  .badge.show { display: block; }
  .label { font-size: 10.5px; color: var(--muted); margin-top: -4px; margin-bottom: 4px; }
  .label.active { color: var(--text); }

  .tooltip {
    position: fixed; left: calc(var(--sidebar) + 4px); padding: 6px 10px; border-radius: 6px;
    background: #050507; color: var(--text); font-size: 13px; font-weight: 600;
    pointer-events: none; opacity: 0; transform: translateX(-4px);
    transition: opacity .12s, transform .12s; white-space: nowrap; z-index: 10;
  }
  .tooltip.show { opacity: 1; transform: none; }
  .tooltip kbd { color: var(--muted); font: inherit; font-weight: 400; margin-left: 6px; }

  .spacer { flex: 1; }
  .sep { width: 32px; height: 2px; border-radius: 1px; background: #1f1f2a; margin: 2px 0; }
  .settings {
    width: 40px; height: 40px; border: 0; border-radius: 12px; cursor: pointer;
    background: transparent; color: var(--muted); display: grid; place-items: center;
  }
  .settings:hover { background: var(--hover); color: var(--text); }
  .settings svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">S<span>H</span></div>
    <button class="nav-btn" data-nav="back" title="Précédent (Alt+←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" data-nav="forward" title="Suivant (Alt+→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nav-btn" data-nav="reload" title="Actualiser (Ctrl+R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="nav-btn" data-nav="home" title="Accueil du service">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <div class="title" id="title"></div>
    <div class="progress" id="progress"></div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div id="services" style="display:flex;flex-direction:column;align-items:center;gap:8px"></div>
    <div class="spacer"></div>
    <div class="sep"></div>
    <button class="settings" id="settings" title="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </nav>

  <div class="tooltip" id="tooltip"></div>

<script>
  // Icônes génériques (vidéo, discussion, musique)
  const ICONS = {
    youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>',
    discord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><circle cx="9" cy="12" r=".9" fill="currentColor"/><circle cx="13" cy="12" r=".9" fill="currentColor"/><circle cx="17" cy="12" r=".9" fill="currentColor"/></svg>',
    spotify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  };
  ICONS.games = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 7h9a5 5 0 0 1 4.9 6l-.8 3.8a2.4 2.4 0 0 1-4.1 1.1L14.4 16H9.6l-2.1 1.9a2.4 2.4 0 0 1-4.1-1.1L2.6 13a5 5 0 0 1 4.9-6z"/><path d="M8 10v4M6 12h4"/><circle cx="15.5" cy="11" r=".9" fill="currentColor"/><circle cx="17.5" cy="13" r=".9" fill="currentColor"/></svg>';
  const DARK_INK = new Set(['spotify', 'games']); // icône noire sur fond vert clair

  const $services = document.getElementById('services');
  const $title = document.getElementById('title');
  const $progress = document.getElementById('progress');
  const $tooltip = document.getElementById('tooltip');
  let built = false;

  function build(state) {
    $services.innerHTML = '';
    state.services.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'svc' + (DARK_INK.has(s.id) ? ' dark-ink' : '');
      btn.dataset.id = s.id;
      btn.style.setProperty('--c', s.color);
      btn.innerHTML = (ICONS[s.id] || '') + '<span class="badge"></span>';
      btn.addEventListener('click', () => window.hub.switchTo(s.id));
      btn.addEventListener('mouseenter', () => {
        const r = btn.getBoundingClientRect();
        $tooltip.innerHTML = s.name + '<kbd>Ctrl+' + (i + 1) + '</kbd>';
        $tooltip.style.top = (r.top + r.height / 2 - 15) + 'px';
        $tooltip.classList.add('show');
      });
      btn.addEventListener('mouseleave', () => $tooltip.classList.remove('show'));
      const label = document.createElement('div');
      label.className = 'label';
      label.dataset.id = s.id;
      label.textContent = s.name;
      $services.append(btn, label);
    });
    built = true;
  }

  function render(state) {
    if (!built) build(state);
    const active = state.services.find((s) => s.id === state.active);
    for (const s of state.services) {
      const btn = $services.querySelector('.svc[data-id="' + s.id + '"]');
      const label = $services.querySelector('.label[data-id="' + s.id + '"]');
      const isActive = s.id === state.active;
      btn.classList.toggle('active', isActive);
      label.classList.toggle('active', isActive);
      const badge = btn.querySelector('.badge');
      badge.classList.toggle('show', s.badge !== 0);
      badge.classList.toggle('dot', s.badge < 0);
      badge.textContent = s.badge > 0 ? (s.badge > 99 ? '99+' : String(s.badge)) : '';
    }
    if (active) {
      document.documentElement.style.setProperty('--accent', active.color);
      const page = active.title && active.title !== active.name ? ' — ' + active.title : '';
      $title.innerHTML = '';
      const b = document.createElement('b');
      b.textContent = active.name;
      $title.append(b, document.createTextNode(page));
      $progress.classList.toggle('on', active.loading);
      document.title = 'Simply Hub — ' + active.name;
    }
  }

  document.querySelectorAll('[data-nav]').forEach((el) =>
    el.addEventListener('click', () => window.hub.nav(el.dataset.nav)));
  document.getElementById('settings').addEventListener('click', () => window.hub.openMenu());

  window.hub.onState(render);
  window.hub.getState().then(render);
</script>
</body>
</html>
