<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hors ligne</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f0f14; color: #e9e9f1;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; overflow: hidden; }
  body::before { content: ""; position: fixed; width: 520px; height: 520px; border-radius: 50%; filter: blur(90px); opacity: .18;
    background: conic-gradient(#ff3b4e, #5b6cff, #1fdc6a, #ffb21e, #ff3b4e); animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .box { position: relative; max-width: 420px; padding: 34px 30px; border-radius: 24px; background: rgba(23, 23, 31, .85);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 70px rgba(0,0,0,.45); }
  .ic { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; background: #1d1d27; color: #ffb21e; }
  .ic svg { width: 30px; height: 30px; }
  h1 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 22px; margin: 0 0 8px; letter-spacing: -.3px; }
  p { color: #8b8b9c; margin: 0 0 24px; line-height: 1.55; }
  button { height: 44px; padding: 0 26px; border-radius: 13px; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #5b6cff, #4a8cff); box-shadow: 0 10px 24px rgba(91,108,255,.35); }
  button:hover { filter: brightness(1.1); }
  .auto { margin-top: 14px; font-size: 12.5px; color: #6c6c7c; }
</style>
</head>
<body>
  <div class="box">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/><path d="M3 3l18 18"/></svg></div>
    <h1 id="h">Impossible de charger le service</h1>
    <p>Vérifie ta connexion Internet, puis réessaie.</p>
    <button id="retry">Réessayer</button>
    <div class="auto">La page se rechargera toute seule dès que la connexion revient.</div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('url');
  if (q.get('name')) document.getElementById('h').textContent = 'Impossible de charger ' + q.get('name');
  document.getElementById('retry').onclick = () => { if (url) location.href = url; };
  window.addEventListener('online', () => { if (url) location.href = url; });
</script>
</body>
</html>
